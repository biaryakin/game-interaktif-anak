<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Pilihan Ganda – Tubuh Manusia</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F0FF;
    --card: #FFFFFF;
    --primary: #7C3AED;
    --primary-dark: #5B21B6;
    --primary-light: #EDE9FE;
    --accent: #F59E0B;
    --accent-light: #FEF3C7;
    --green: #059669;
    --green-light: #D1FAE5;
    --red: #DC2626;
    --red-light: #FEE2E2;
    --text: #1E1035;
    --text-soft: #6D5D8A;
    --radius: 18px;
    --shadow: 0 4px 24px rgba(124,58,237,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
  height: 100%;
  overflow-x: hidden;
  }
  
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  .game-emoji {
    font-size: 50px;
    display: block;
    margin-bottom: 6px;
    animation: pulse 2.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 900;
    color: var(--primary-dark);
  }

  .subtitle {
    font-size: 0.95rem;
    color: var(--text-soft);
    font-weight: 600;
    margin-top: 4px;
  }

  /* HUD */
  .hud {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 800;
    font-size: 0.88rem;
    padding: 6px 16px;
    border-radius: 99px;
  }

  .badge-score {
    background: var(--accent-light);
    border: 2px solid var(--accent);
    color: #78350F;
  }

  .badge-progress {
    background: var(--primary-light);
    border: 2px solid var(--primary);
    color: var(--primary-dark);
  }

  /* Progress bar */
  .progress-bar-wrap {
    width: 100%;
    max-width: 540px;
    margin-bottom: 20px;
  }

  .progress-bar {
    height: 10px;
    background: #DDD6FE;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #A78BFA);
    border-radius: 99px;
    transition: width 0.5s ease;
  }

  /* Card */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    width: 100%;
    max-width: 540px;
  }

  .question-num {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.55;
    margin-bottom: 22px;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 14px;
    border: 2.5px solid #E5E0F5;
    background: #FAFAFA;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    text-align: left;
    transition: transform 0.1s, background 0.15s, border-color 0.15s;
    width: 100%;
  }

  .option-btn:hover:not(:disabled) {
    background: var(--primary-light);
    border-color: #C4B5FD;
    transform: translateX(4px);
  }

  .option-label {
    min-width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-weight: 900;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }

  .option-btn.correct {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green);
  }

  .option-btn.correct .option-label {
    background: var(--green);
    color: white;
  }

  .option-btn.wrong {
    background: var(--red-light);
    border-color: var(--red);
    color: var(--red);
    animation: shake 0.35s ease;
  }

  .option-btn.wrong .option-label {
    background: var(--red);
    color: white;
  }

  .option-btn.show-correct {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green);
  }

  .option-btn.show-correct .option-label {
    background: var(--green);
    color: white;
  }

  .option-btn:disabled { cursor: default; transform: none !important; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* Feedback */
  .feedback {
    border-radius: 12px;
    padding: 10px 16px;
    font-weight: 800;
    font-size: 0.95rem;
    display: none;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .feedback.show { display: block; }
  .feedback.correct { background: var(--green-light); color: var(--green); }
  .feedback.wrong { background: var(--red-light); color: var(--red); }

  /* Next button */
  .btn-next {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 0 #3B0764;
    transition: transform 0.1s, filter 0.1s;
    display: none;
  }

  .btn-next.show { display: block; }
  .btn-next:active { transform: scale(0.98); }
  .btn-next:hover { filter: brightness(1.07); }

  /* Win screen */
  .win-screen {
    display: none;
    text-align: center;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 28px;
    width: 100%;
    max-width: 540px;
  }

  .win-screen.show { display: block; }

  .win-emoji {
    font-size: 64px;
    display: block;
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .win-title {
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--primary-dark);
    margin: 12px 0 6px;
  }

  .win-sub {
    color: var(--text-soft);
    font-weight: 600;
    margin-bottom: 20px;
  }

  .score-breakdown {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .score-box {
    background: var(--primary-light);
    border-radius: 14px;
    padding: 14px 20px;
    min-width: 100px;
  }

  .score-box .num {
    font-size: 2rem;
    font-weight: 900;
    color: var(--primary-dark);
    display: block;
  }

  .score-box .lbl {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-soft);
  }

  .score-box.gold { background: var(--accent-light); }
  .score-box.gold .num { color: #92400E; }

  .btn-restart {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: 0 4px 0 #3B0764;
    padding: 14px 36px;
    font-size: 1.05rem;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    border: none;
    cursor: pointer;
    transition: transform 0.1s;
  }

  .btn-restart:active { transform: scale(0.97); }
</style>
</head>
<body>

<header>
  <span class="game-emoji">🧠</span>
  <h1>Kuis Tubuh Manusia</h1>
  <p class="subtitle">Uji pengetahuanmu tentang tubuh!</p>
</header>

<div class="hud">
  <div class="badge badge-score">⭐ Skor: <span id="score">0</span></div>
  <div class="badge badge-progress">Soal <span id="current-num">1</span> dari <span id="total-num">15</span></div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width: 6.67%"></div>
  </div>
</div>

<div class="card" id="game-card">
  <div class="question-num" id="question-num">Soal 1</div>
  <div class="question-text" id="question-text"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button class="btn-next" id="btn-next" onclick="nextQuestion()">Soal Berikutnya →</button>
</div>

<div class="win-screen" id="win-screen">
  <span class="win-emoji" id="win-emoji">🎉</span>
  <div class="win-title" id="win-title">Luar Biasa!</div>
  <div class="win-sub" id="win-sub">Kamu sudah menyelesaikan semua soal!</div>
  <div class="score-breakdown">
    <div class="score-box gold">
      <span class="num" id="final-score">0</span>
      <span class="lbl">Total Skor</span>
    </div>
    <div class="score-box">
      <span class="num" id="final-correct">0</span>
      <span class="lbl">Jawaban Benar</span>
    </div>
    <div class="score-box">
      <span class="num" id="final-wrong">0</span>
      <span class="lbl">Jawaban Salah</span>
    </div>
  </div>
  <button class="btn-restart" onclick="restartGame()">🔁 Main Lagi</button>
</div>

<script>
const questions = [
  {
    q: "Apa nama organ tubuh yang menghasilkan insulin (zat untuk mengubah gula menjadi energi tubuh)?",
    options: ["Empedu", "Pankreas", "Hati", "Ginjal"],
    correct: 1
  },
  {
    q: "Zat yang membuat kuku dan rambut terus tumbuh meski sudah dipotong adalah ...",
    options: ["Vitamin E", "Kalsium", "Keratin", "Zat Besi"],
    correct: 2
  },
  {
    q: "Penyerapan gizi dan sari makanan agar menjadi kekuatan untuk tubuh terjadi di mana?",
    options: ["Usus Halus", "Usus Besar", "Lambung", "Kerongkongan"],
    correct: 0
  },
  {
    q: "Apa nama zat untuk melindungi kulit dari sengatan sinar matahari?",
    options: ["Serotonin", "Dopamin", "Insulin", "Melanin"],
    correct: 3
  },
  {
    q: "Sisa makanan yang tidak diserap akan disalurkan ke mana?",
    options: ["Hati", "Lambung", "Usus Buntu", "Usus Besar"],
    correct: 3
  },
  {
    q: "Berapa jumlah gigi anak-anak?",
    options: ["20", "22", "18", "24"],
    correct: 0
  },
  {
    q: "Berapa jumlah gigi orang dewasa?",
    options: ["36", "28", "32", "30"],
    correct: 2
  },
  {
    q: "Nama sel yang membentuk koreng ketika tubuh terluka adalah …",
    options: ["Sel Darah Putih", "Trombosit", "Hemoglobin", "Vitamin B"],
    correct: 1
  },
  {
    q: "Zat yang menjadikan tulang bertambah kuat dinamakan …",
    options: ["Protein", "Vitamin A", "Asam Amino", "Kalsium dan Vitamin D"],
    correct: 3
  },
  {
    q: "Nanah adalah sel-sel yang telah bertarung melawan kuman pada luka. Apa nama sel tersebut?",
    options: ["Karbohidrat", "Otot", "Sel Darah Putih", "Sel Darah Merah"],
    correct: 2
  },
  {
    q: "Ketika bernapas, zat yang dihirup dan dikeluarkan oleh tubuh adalah ...",
    options: ["Oksigen dan Karbon Dioksida", "Nitrogen dan Karbon Monoksida", "Hidrogen dan Oksigen", "Oksigen dan Nitrogen"],
    correct: 0
  },
  {
    q: "Manakah kegiatan yang bisa menyebabkan mata menjadi rabun?",
    options: [
      "Membaca buku di tempat yang terang.",
      "Bermain di luar dan melihat pemandangan alam.",
      "Melihat komputer atau handphone di tempat gelap.",
      "Istirahat ketika lelah."
    ],
    correct: 2
  },
  {
    q: "Berikut ini adalah akibat menghirup asap rokok, kecuali ...",
    options: [
      "Tenggorokan kering.",
      "Paru-paru menjadi segar.",
      "Batuk dan sesak napas.",
      "Paru-paru menjadi kotor."
    ],
    correct: 1
  },
  {
    q: "Cara menjaga kesehatan ginjal adalah sebagai berikut, kecuali …",
    options: [
      "Rajin minum air putih.",
      "Segera pipis ketika kebelet.",
      "Jalan kaki untuk berolahraga.",
      "Jarang minum air putih dan sering menahan pipis."
    ],
    correct: 3
  },
  {
    q: "Berikut ini adalah cara membuat otak menjadi lebih sehat, kecuali ...",
    options: [
      "Makan bergizi.",
      "Malas belajar karena membosankan.",
      "Belajar hal baru walau sulit.",
      "Istirahat tepat waktu."
    ],
    correct: 1
  }
];

const labels = ['A', 'B', 'C', 'D'];
const scoreTable = [0, 6.7, 13.3, 20, 26.7, 33.3, 40, 46.7, 53.3, 60, 66.7, 73.3, 80, 86.7, 93.3, 100];
let current = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let shuffled = [];

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function startGame() {
  current = 0;
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  shuffled = shuffle(questions);

  document.getElementById('score').textContent = 0;
  document.getElementById('total-num').textContent = questions.length;
  document.getElementById('win-screen').classList.remove('show');
  document.getElementById('game-card').style.display = '';
  loadQuestion();
}

function loadQuestion() {
  const q = shuffled[current];
  const num = current + 1;

  document.getElementById('question-num').textContent = `Soal ${num}`;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('current-num').textContent = num;
  document.getElementById('progress-fill').style.width = `${(num / questions.length) * 100}%`;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('btn-next').className = 'btn-next';

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-label">${labels[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(i, btn));
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(index, btn) {
  const q = shuffled[current];
  const allBtns = document.querySelectorAll('.option-btn');

  // Disable all
  allBtns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');

  if (index === q.correct) {
    btn.classList.add('correct');
    correctCount++;
    score = scoreTable[correctCount];
    document.getElementById('score').textContent = score;
    fb.textContent = '✅ Benar! Kamu hebat!';
    fb.className = 'feedback show correct';
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    // Show correct answer
    allBtns[q.correct].classList.add('show-correct');
    fb.textContent = `❌ Belum tepat. Jawaban yang benar: ${labels[q.correct]}. ${q.options[q.correct]}`;
    fb.className = 'feedback show wrong';
  }

  const btnNext = document.getElementById('btn-next');
  btnNext.textContent = current + 1 < questions.length ? 'Soal Berikutnya →' : 'Lihat Hasil 🎉';
  btnNext.className = 'btn-next show';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showWin();
  } else {
    loadQuestion();
  }
}

function showWin() {
  document.getElementById('game-card').style.display = 'none';
  document.getElementById('progress-fill').style.width = '100%';

  const pct = Math.round((correctCount / questions.length) * 100);
  let emoji = '🎉', title = 'Luar Biasa!', sub = 'Kamu sangat pintar tentang tubuh manusia!';
  if (pct === 100) { emoji = '🏆'; title = 'Sempurna!'; sub = 'Semua jawaban benar! Kamu luar biasa!'; }
  else if (pct >= 80) { emoji = '🥇'; title = 'Hebat Sekali!'; sub = 'Hampir sempurna, terus semangat belajar!'; }
  else if (pct >= 60) { emoji = '🥈'; title = 'Bagus!'; sub = 'Kamu sudah tahu banyak tentang tubuh manusia!'; }
  else { emoji = '💪'; title = 'Tetap Semangat!'; sub = 'Coba lagi dan kamu pasti bisa lebih baik!'; }

  document.getElementById('win-emoji').textContent = emoji;
  document.getElementById('win-title').textContent = title;
  document.getElementById('win-sub').textContent = sub;
  document.getElementById('final-score').textContent = scoreTable[correctCount];
  document.getElementById('final-correct').textContent = correctCount;
  document.getElementById('final-wrong').textContent = wrongCount;

  const win = document.getElementById('win-screen');
  win.classList.add('show');
}

function restartGame() {
  startGame();
}

startGame();
</script>
</body>
</html>
